[project]
id = "qark"
version = "0.3.1"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi = "win64"
stack_reserve = 67108864
stack_commit = 65536

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi = "sysv64"

[artifact.qark]
kind = "bin"
default = true
entry = "main.mach"
out = "{project.work}/bin/qark{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[artifact.qa]
kind = "bin"
entry = "dev/qa.mach"
out = "{project.work}/bin/qa{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[artifact.tests]
kind = "static"
entry = "test/all.mach"
out = "{project.work}/lib/tests{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.5.0"
