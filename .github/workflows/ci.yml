name: Qark CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  node-differential-and-client:
    name: Node Checker Differential & Client Lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run JavaScript checker differential suite against real node --check oracle
        shell: node {0}
        run: |
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          const helper = path.resolve('scripts/checkers/check.cjs');
          const deepPrefix = Array.from({ length: 36 }, (_, i) => `d${i}`).join('/');
          const cases = [
            ['explicit_cjs_export', { 'package.json': '{"type":"commonjs"}' }, {}, 'a.js', 'export const x=1;\n', false],
            ['cjs_require', {}, {}, 'a.cjs', 'const require=1;\n', false],
            ['cjs_module', {}, {}, 'a.cjs', 'let module=1;\n', false],
            ['to_esm', { 'package.json': '{"type":"commonjs"}' }, { 'package.json': '{"type":"module"}' }, 'a.js', 'await Promise.resolve(1);\n', true],
            ['to_cjs', { 'package.json': '{"type":"module"}' }, { 'package.json': '{"type":"commonjs"}' }, 'a.js', 'await Promise.resolve(1);\n', false],
            ['delete_nested', { 'package.json': '{"type":"module"}', 'sub/package.json': '{"type":"commonjs"}' }, { 'sub/package.json': null }, 'sub/a.js', 'export const x=1;\n', true],
            ['valid', {}, {}, 'a.mjs', 'export const x=1;\n', true],
            ['invalid', { 'package.json': '{"type":"commonjs"}' }, {}, 'a.js', 'const x=;\n', false],
            ['no_package_export', {}, {}, 'a.js', 'export const x=1;\n', true],
            ['no_type_await', { 'package.json': '{}' }, {}, 'a.js', 'await Promise.resolve(1);\n', true],
            ['no_type_binding', { 'package.json': '{}' }, {}, 'a.js', 'const require=1;\n', true],
            ['malformed_package', { 'package.json': '{oops' }, {}, 'a.js', 'const x=1;\n', false],
            ['bom_package_esm', { 'package.json': '\uFEFF{"type":"module"}' }, {}, 'a.js', 'if (require.main === module) { return; }\n', false],
            ['deep_dir_esm', { 'package.json': '{"type":"module"}' }, {}, `${deepPrefix}/a.js`, 'if (require.main === module) { return; }\n', false],
            ['unknown_string_type', { 'package.json': '{"type":"custom-mode"}' }, {}, 'a.js', 'const require=1;\n', true],
          ];

          for (const [label, diskFiles, overlayFiles, relPath, text, expectedOk] of cases) {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'qark-ci-chk-'));
            const oracleRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'qark-ci-oracle-'));
            try {
              for (const [k, v] of Object.entries(diskFiles)) {
                for (const base of [root, oracleRoot]) {
                  const full = path.join(base, k);
                  fs.mkdirSync(path.dirname(full), { recursive: true });
                  fs.writeFileSync(full, v, 'utf8');
                }
              }
              const packages = Object.entries(overlayFiles).map(([p, t]) =>
                t === null ? { name: p, deleted: true } : { name: p, text: t }
              );
              for (const [p, t] of Object.entries(overlayFiles)) {
                const full = path.join(oracleRoot, p);
                if (t === null) {
                  fs.rmSync(full, { force: true });
                } else {
                  fs.mkdirSync(path.dirname(full), { recursive: true });
                  fs.writeFileSync(full, t, 'utf8');
                }
              }
              const oracleTarget = path.join(oracleRoot, relPath);
              fs.mkdirSync(path.dirname(oracleTarget), { recursive: true });
              fs.writeFileSync(oracleTarget, text, 'utf8');
              const oracleRes = spawnSync(process.execPath, ['--check', oracleTarget], { encoding: 'utf8' });
              const oracleOk = oracleRes.status === 0;
              if (oracleOk !== expectedOk) {
                throw new Error(`${label}: real node --check returned ok=${oracleOk} (expected ${expectedOk}): ${oracleRes.stderr}`);
              }

              const payload = JSON.stringify([{ root, packages, name: relPath, text }]);
              const res = spawnSync(process.execPath, [helper], { input: payload, encoding: 'utf8' });
              if (res.status !== 0) {
                throw new Error(`${label}: helper exited with ${res.status}: ${res.stderr}`);
              }
              const parsed = JSON.parse(res.stdout);
              if (!Array.isArray(parsed) || parsed.length !== 1 || Boolean(parsed[0].ok) !== expectedOk) {
                throw new Error(`${label}: expected ok=${expectedOk}, got ${res.stdout}`);
              }
              console.log(`PASS ${label}: ok=${parsed[0].ok} (matches real node --check)`);
            } finally {
              fs.rmSync(root, { recursive: true, force: true });
              fs.rmSync(oracleRoot, { recursive: true, force: true });
            }
          }

      - name: Run QarkSession client lifecycle & protocol hardening suite
        shell: node {0}
        run: |
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { QarkSession } = await import(pathToFileURL(path.resolve('scripts/client/qark-session.mjs')).href);

          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'qark-ci-cli-'));
          try {
            const writeWorker = (name, code) => {
              const p = path.join(tmp, name);
              fs.writeFileSync(p, code, 'utf8');
              return p;
            };

            // 1. Exit-before-reply rejects with QARK_PROCESS_EXITED
            {
              const w = writeWorker('exit7.mjs', 'process.stdin.once("data", () => process.exit(7));');
              const s = new QarkSession({ bin: process.execPath, args: [w] });
              let code = null;
              try { await s.request('session.info', {}); } catch (e) { code = e.code; }
              if (code !== 'QARK_PROCESS_EXITED' || s.pending.size !== 0) {
                throw new Error(`exit7 failed: code=${code}, pending=${s.pending.size}`);
              }
            }

            // 2. Malformed JSON rejects with QARK_BAD_JSON
            {
              const w = writeWorker('badjson.mjs', 'process.stdin.once("data", () => process.stdout.write("{bad\\n"));');
              const s = new QarkSession({ bin: process.execPath, args: [w] });
              let code = null;
              try { await s.request('session.info', {}); } catch (e) { code = e.code; }
              await s.close(100);
              if (code !== 'QARK_BAD_JSON' || s.pending.size !== 0) {
                throw new Error(`badjson failed: code=${code}, pending=${s.pending.size}`);
              }
            }

            // 3. Valid JSON null frame rejects with QARK_BAD_PROTOCOL (never throws uncaught TypeError)
            {
              const w = writeWorker('nulljson.mjs', 'process.stdin.once("data", () => process.stdout.write("null\\n"));');
              const s = new QarkSession({ bin: process.execPath, args: [w] });
              let code = null;
              try { await s.request('session.info', {}); } catch (e) { code = e.code; }
              await s.close(100);
              if (code !== 'QARK_BAD_PROTOCOL' || s.pending.size !== 0) {
                throw new Error(`nulljson failed: code=${code}, pending=${s.pending.size}`);
              }
            }

            // 4. Worker ignoring SIGTERM is escalated and reaped by close()
            {
              const w = writeWorker(
                'ignoreterm.mjs',
                'import readline from "node:readline"; process.on("SIGTERM", () => {}); const rl = readline.createInterface({ input: process.stdin }); rl.on("line", (l) => { const m = JSON.parse(l); process.stdout.write(JSON.stringify({ id: m.id, ok: true, result: { ok: true } }) + "\\n"); });'
              );
              const s = new QarkSession({ bin: process.execPath, args: [w] });
              await s.request('ping', {});
              await s.close(60);
              if (s.proc.exitCode === null && s.proc.signalCode === null) {
                throw new Error('ignoreterm worker was still alive after close(60)');
              }
            }

            // 5. Backpressure listener cleanup and strict envelope validation (R3-10)
            {
              const w = writeWorker(
                'backpressure.mjs',
                'import readline from "node:readline"; const rl = readline.createInterface({ input: process.stdin }); rl.on("line", (l) => { const m = JSON.parse(l); if (m.op === "bad_ok") { process.stdout.write(JSON.stringify({ id: m.id, ok: true }) + "\\n"); } else { process.stdout.write(JSON.stringify({ id: m.id, ok: true, result: { n: m.id } }) + "\\n"); } });'
              );
              const s = new QarkSession({ bin: process.execPath, args: [w] });
              const big = 'x'.repeat(65536);
              const reqs = Array.from({ length: 30 }, () => s.request('ping', { pad: big }));
              await Promise.all(reqs);
              if (s.proc.listenerCount('exit') > 2 || s.proc.stdin.listenerCount('drain') > 1) {
                throw new Error(`listener leak: exit=${s.proc.listenerCount('exit')}, drain=${s.proc.stdin.listenerCount('drain')}`);
              }
              let badCode = null;
              try { await s.request('bad_ok', {}); } catch (e) { badCode = e.code; }
              await s.close(60);
              if (badCode !== 'QARK_BAD_PROTOCOL') {
                throw new Error(`expected QARK_BAD_PROTOCOL on ok:true without result, got ${badCode}`);
              }
            }
            console.log('PASS all 5 QarkSession client lifecycle & backpressure cases');
          } finally {
            fs.rmSync(tmp, { recursive: true, force: true });
          }

      - name: Verify MCP tool schemas and annotations
        shell: node {0}
        run: |
          import fs from 'node:fs';
          const tools = JSON.parse(fs.readFileSync('scripts/mcp/tools.json', 'utf8'));
          if (!Array.isArray(tools) || tools.length !== 9) {
            throw new Error(`Expected 9 MCP tools, got ${tools?.length}`);
          }
          const byName = Object.fromEntries(tools.map((t) => [t.name, t]));
          for (const mut of ['qark_apply', 'qark_edit', 'qark_undo']) {
            if (byName[mut]?.annotations?.destructiveHint !== true) {
              throw new Error(`${mut} must have destructiveHint: true`);
            }
          }
          if (byName.qark_check?.annotations?.readOnlyHint !== false || byName.qark_check?.annotations?.idempotentHint !== false) {
            throw new Error('qark_check must have readOnlyHint: false and idempotentHint: false');
          }
          console.log('PASS MCP tool schemas and annotations');

  native-build-and-suite:
    name: Native Mach Build, Unit Tests & Integration Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mach compiler (v6.10.1) on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/briar-systems/mach/releases/download/v6.10.1/mach-6.10.1-x86_64-linux.tar.gz -o /tmp/mach.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/mach.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/mach"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mach" --version

      - name: Install Mach compiler (v6.10.1) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:TEMP "mach.zip"
          $destDir = Join-Path $env:TEMP "mach-bin"
          Invoke-WebRequest -Uri "https://github.com/briar-systems/mach/releases/download/v6.10.1/mach-6.10.1-x86_64-windows.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          $machExe = Get-ChildItem -Path $destDir -Filter "mach.exe" -Recurse | Select-Object -First 1
          if (-not $machExe) { throw "mach.exe not found in archive" }
          $machExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $machExe.FullName --version

      - name: Build and run POSIX unit, smoke, permission, torn-journal, and SIGKILL suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' ./build.sh
          sh ./build.sh
          node ./scripts/ci/posix-suite.mjs

      - name: Build and run full unit + apply-suite.ps1 integration suite (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
